# Danish lexicon for Prong 2 rule-based evaluation
#
# politeness_cues / rudeness_cues:
#   Best-effort translation of the English canonical markers derived from
#   Danescu-Niculescu-Mizil et al. (2013), ACL 2013 (P13-1025).
#   To be refined by annotators.
#
# formal_markers, informal_markers, modal_verbs, uncertainty_cues:
#   Best-effort; not sourced from a specific publication.

politeness_cues:
  - venligst
  - tak
  - vær så venlig
  - værdsætter
  - velkommen

rudeness_cues:
  - straks
  - skynd dig
  - nu

formal_markers:
  - kære
  - ville
  - må jeg
  - respektfuldt
  - med venlig hilsen
  - hilsen

informal_markers:
  - hej
  - yo
  - mand
  - makker
  - lol

modal_verbs:
  - kan
  - kunne
  - skal
  - ville
  - burde
  - måtte

uncertainty_cues:
  - måske
  - muligvis
  - tilsyneladende
  - ser ud til
  - angiveligt
  - formentlig

