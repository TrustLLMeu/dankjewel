# Dutch lexicon for Prong 2 rule-based evaluation
#
# politeness_cues / rudeness_cues:
#   Best-effort translation of the English canonical markers derived from
#   Danescu-Niculescu-Mizil et al. (2013), ACL 2013 (P13-1025).
#   To be refined by annotators.
#
# formal_markers, informal_markers, modal_verbs, uncertainty_cues:
#   Best-effort; not sourced from a specific publication.

politeness_cues:
  - alstublieft
  - dank
  - vriendelijk
  - waarderen
  - welkom

rudeness_cues:
  - onmiddellijk
  - schiet op
  - haast

formal_markers:
  - geachte
  - zou
  - mag ik
  - respectvol
  - hoogachtend
  - met vriendelijke groet

informal_markers:
  - hoi
  - gast
  - maat
  - lol
  - joh

modal_verbs:
  - kan
  - zou
  - kon
  - mag
  - moet
  - zal

uncertainty_cues:
  - misschien
  - wellicht
  - mogelijk
  - schijnbaar
  - lijkt
  - vermoedelijk

