# Swedish lexicon for Prong 2 rule-based evaluation
#
# politeness_cues / rudeness_cues:
#   Best-effort translation of the English canonical markers derived from
#   Danescu-Niculescu-Mizil et al. (2013), ACL 2013 (P13-1025).
#   To be refined by annotators.
#
# formal_markers, informal_markers, modal_verbs, uncertainty_cues:
#   Best-effort; not sourced from a specific publication.

politeness_cues:
  - snälla
  - tack
  - vänligen
  - uppskattar
  - välkommen

rudeness_cues:
  - genast
  - skynda
  - fort

formal_markers:
  - bästa
  - skulle
  - får jag
  - respektfullt
  - med vänlig hälsning
  - hälsningar

informal_markers:
  - hej
  - tjena
  - grabben
  - kompis
  - lol
  - asså

modal_verbs:
  - kan
  - kunde
  - ska
  - skulle
  - borde
  - måste

uncertainty_cues:
  - kanske
  - möjligen
  - eventuellt
  - verkar
  - tycks
  - påstås

