# Icelandic lexicon for Prong 2 rule-based evaluation
#
# politeness_cues / rudeness_cues:
#   Best-effort translation of the English canonical markers derived from
#   Danescu-Niculescu-Mizil et al. (2013), ACL 2013 (P13-1025).
#   To be refined by annotators.
#
# formal_markers, informal_markers, modal_verbs, uncertainty_cues:
#   Best-effort; not sourced from a specific publication.

politeness_cues:
  - vinsamlegast
  - takk
  - gjörðu svo vel
  - þakka
  - velkominn

rudeness_cues:
  - strax
  - flýttu þér
  - núna

formal_markers:
  - kæri
  - kæra
  - virðulega
  - með kveðju
  - virðingarfyllst

informal_markers:
  - hæ
  - yo
  - maður
  - lol

modal_verbs:
  - getur
  - gæti
  - skal
  - skyldi
  - má
  - vildi

uncertainty_cues:
  - kannski
  - mögulega
  - virðist
  - sýnist
  - að sögn
  - hugsanlega

