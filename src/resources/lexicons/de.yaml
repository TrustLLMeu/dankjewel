# German lexicon for Prong 2 rule-based evaluation
#
# politeness_cues / rudeness_cues:
#   Best-effort translation of the English canonical markers derived from
#   Danescu-Niculescu-Mizil et al. (2013), ACL 2013 (P13-1025).
#   To be refined by annotators.
#
# formal_markers, informal_markers, modal_verbs, uncertainty_cues:
#   Best-effort; not sourced from a specific publication.

politeness_cues:
  - bitte
  - danke
  - freundlicherweise
  - schätzen
  - willkommen

rudeness_cues:
  - sofort
  - beeil dich
  - schnell

formal_markers:
  - sehr geehrte
  - würde
  - darf ich
  - respektvoll
  - hochachtungsvoll
  - mit freundlichen grüßen

informal_markers:
  - hey
  - alter
  - digga
  - lol
  - krass

modal_verbs:
  - kann
  - könnte
  - darf
  - sollte
  - würde
  - mag

uncertainty_cues:
  - vielleicht
  - möglicherweise
  - eventuell
  - scheint
  - anscheinend
  - angeblich

